# Xibo CMS - production Docker Compose configuration
#
# Copy .env.template to .env, edit it to suit your environment, then run:
#
#   docker compose up -d
#
# See README.md for full installation, upgrade and migration instructions.
# For a development environment use docker-compose.dev.yml instead.

# A fixed project name, so containers are always recreated in place on
# upgrade, whatever the folder is called. To run more than one CMS on the
# same host, set COMPOSE_PROJECT_NAME in each installation's .env.
name: xibo

services:
  cms-db:
    image: mysql:8.4
    # Only started when the "local-db" profile is enabled (the default in
    # .env.template). Remove COMPOSE_PROFILES=local-db from .env to use a
    # remote MySQL server instead.
    profiles:
      - local-db
    volumes:
      - "./shared/db:/var/lib/mysql:Z"
    # Same defaults as cms-web below, so both always agree on the database
    # and user the CMS connects with.
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cms}
      - MYSQL_USER=${MYSQL_USER:-cms}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    env_file: .env
    restart: always
    mem_limit: 1g

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:1.5
    ports:
      - "${CMS_XMR_PORT:-9505}:9505"
    env_file: .env
    restart: always
    mem_limit: 256m

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:stable
    depends_on:
      cms-db:
        condition: service_started
        required: false
    volumes:
      - "./shared/cms/custom:/var/www/cms/custom:Z"
      - "./shared/backup:/var/www/backup:Z"
      - "./shared/cms/library:/var/www/cms/library:Z"
      - "./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
      - "./shared/cms/ca-certs:/var/www/cms/ca-certs:Z"
    env_file: .env
    environment:
      - MYSQL_HOST=${MYSQL_HOST:-cms-db}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-cms}
      - MYSQL_USER=${MYSQL_USER:-cms}
      # Fail fast: with no password the bundled MySQL silently skips
      # creating the CMS user and cms-web can never connect.
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env (copy .env.template to .env first)}
      - XMR_HOST=cms-xmr
      - CMS_USE_MEMCACHED=${CMS_USE_MEMCACHED:-true}
      - MEMCACHED_HOST=${MEMCACHED_HOST:-cms-memcached}
    ports:
      - "${CMS_WEB_PORT:-80}:80"
    restart: always
    mem_limit: 1g

  cms-memcached:
    image: memcached:alpine
    command: memcached -m 15
    restart: always
    mem_limit: 100M

  cms-quickchart:
    image: ianw/quickchart
    restart: always
