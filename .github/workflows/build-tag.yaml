name: Build Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build Containers
    if: github.repository == 'xibosignage/xibo-cms'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Build X
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/xibosignage/xibo-cms:release-${{ github.ref_name }}
          build-args: GIT_COMMIT=${{ github.sha }}
          push: true
          load: false
          provenance: false

      - name: Pull Image
        run: |
          docker pull ghcr.io/xibosignage/xibo-cms:release-${GITHUB_REF##*/}

      - name: Export JS dependency manifests for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          target: sbom-context
          cache-from: type=gha
          outputs: type=local,dest=./sbom-context

      - name: Generate SBOM (Syft native)
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ghcr.io/xibosignage/xibo-cms:release-${{ github.ref_name }}
          format: json
          output-file: xibo-cms-${{ github.ref_name }}.syft.json
          artifact-name: sbom-syft-${{ github.ref_name }}

      - name: Generate SBOM (CycloneDX, image)
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ghcr.io/xibosignage/xibo-cms:release-${{ github.ref_name }}
          format: cyclonedx-json@1.6
          output-file: xibo-cms-${{ github.ref_name }}-image.cdx.json
          artifact-name: sbom-cyclonedx-image-${{ github.ref_name }}

      - name: Generate SBOM (CycloneDX, JS dependencies)
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          path: ./sbom-context/js
          format: cyclonedx-json@1.6
          output-file: xibo-cms-${{ github.ref_name }}-js.cdx.json
          artifact-name: sbom-cyclonedx-js-${{ github.ref_name }}

      - name: Merge SBOMs (CycloneDX)
        run: |
          docker run --rm -v "$PWD":/wrk -w /wrk cyclonedx/cyclonedx-cli:0.33.1 merge \
            --input-files xibo-cms-${GITHUB_REF##*/}-image.cdx.json xibo-cms-${GITHUB_REF##*/}-js.cdx.json \
            --output-file xibo-cms-${GITHUB_REF##*/}.cdx.json \
            --output-format json \
            --output-version v1_6

      - name: Build archive
        run: |
          CONTAINER=$(docker create ghcr.io/xibosignage/xibo-cms:release-${GITHUB_REF##*/})
          echo 'Copying from container.'
          docker cp "$CONTAINER":/var/www/cms/ xibo-cms-${GITHUB_REF##*/}
          tar -czf xibo-cms-${GITHUB_REF##*/}.tar.gz xibo-cms-${GITHUB_REF##*/}
          zip -rq xibo-cms-${GITHUB_REF##*/}.zip xibo-cms-${GITHUB_REF##*/}
          echo 'Added to archives.'
          docker rm "$CONTAINER"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            **.tar.gz
            **.zip
            xibo-cms-${{ github.ref_name }}.syft.json
            xibo-cms-${{ github.ref_name }}.cdx.json